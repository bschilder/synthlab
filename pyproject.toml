[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthlab"
version = "0.1.0"
description = "Python tools for working with Synthea synthetic healthcare data"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["synthea", "synthetic", "healthcare", "omop", "cdm", "patient", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pooch>=1.6.0",
    "pandas>=1.5.0",
    "polars>=0.19.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/synthlab"
Documentation = "https://github.com/yourusername/synthlab#readme"
Repository = "https://github.com/yourusername/synthlab"
Issues = "https://github.com/yourusername/synthlab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthlab*"]

[tool.setuptools.package-data]
synthlab = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
