name: simulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'synthlab/genealogy.py'
      - 'synthlab/genealogical_covariance.py'
      - 'synthlab/genotype_phenotypes.py'
      - 'synthlab/association_bundle.py'
      - 'synthlab/association_recipes.py'
      - 'tests/test_genealogy.py'
      - 'tests/test_genealogical_covariance.py'
      - 'tests/test_genotype_phenotypes.py'
      - 'tests/numerical_modules.py'
      - 'tests/test_association_bundle.py'
      - 'tests/test_association_recipes.py'
      - 'scripts/generate_association_bundle.py'
      - 'scripts/generate_association_batch.py'
      - 'requirements/simulation-test.*'
      - '.github/workflows/simulation.yml'
      - 'pyproject.toml'
      - 'MANIFEST.in'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: requirements/simulation-test.lock
      - name: Sync isolated simulation environment
        run: |
          uv venv --python '${{ matrix.python }}' .venv-simulation
          uv pip sync --python .venv-simulation/bin/python --require-hashes requirements/simulation-test.lock
      - name: Test true genealogies, independent covariance and quantitative phenotypes
        run: .venv-simulation/bin/python -m pytest tests/test_genealogy.py tests/test_genotype_phenotypes.py tests/test_genealogical_covariance.py tests/test_association_recipes.py tests/test_association_bundle.py -q
