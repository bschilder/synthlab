name: synthlab
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.8,<3.13
  - pip
  - pooch>=1.6.0
  - pandas>=1.5.0
  - polars>=0.19.0
  - jupyter
  - notebook
  - ipykernel
  - ipywidgets
  - matplotlib
  - faiss-gpu>=1.7.0
  - pip:
    - boto3>=1.26.0  # Optional: for AWS dataset download
    - requests>=2.28.0  # For UK Biobank Synthetic Dataset downloads
    - tiktoken>=0.6.0
    - torch
    - torchvision
    - transformers>=4.50.0
    - accelerate
    - bitsandbytes
    - biomcp-python